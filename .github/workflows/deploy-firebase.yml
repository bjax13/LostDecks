name: Full project deploy

# Production Hosting target: shardstash (https://shardstash.web.app), plus Firestore and Functions.
# Run workflow on the branch you want to publish (select the PR branch for a pre-merge poke).
# The first successful run creates site shardstash if it is missing.
# Production deploy: run manually after configuring repository secrets (see AGENTS.md).
on:
  workflow_dispatch:

concurrency:
  group: full-project-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy hosting, firestore, and functions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Deploy Hosting, Firestore, and Functions
        run: npm run deploy:firebase
